html,body{height:100%}

<script>
/* ---- PWA: service worker + yükleme ---- */
let deferredInstall=null;
const isStandalone=()=>{try{return matchMedia('(display-mode: standalone)').matches||matchMedia('(display-mode: fullscreen)').matches||navigator.standalone===true}catch(e){return false}};
const isIOS=/iphone|ipad|ipod/i.test(navigator.userAgent)||(navigator.platform==='MacIntel'&&navigator.maxTouchPoints>1);
window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();deferredInstall=e});
window.addEventListener('appinstalled',()=>{deferredInstall=null;const b=document.getElementById('ib2');if(b)b.remove();const m=document.getElementById('im');if(m)m.textContent='Uygulama yüklendi 🎉';try{if(typeof setOpen!=='undefined'&&setOpen){msg='Uygulama yüklendi 🎉';drawSet()}}catch(e){}});
if('serviceWorker' in navigator&&/^https?:$/.test(location.protocol)){window.addEventListener('load',()=>{navigator.serviceWorker.register('sw.js').catch(()=>{})})}
async function installApp(){
 if(isStandalone())return 'Uygulama zaten yüklü.';
 if(deferredInstall){const p=deferredInstall;deferredInstall=null;
  try{p.prompt();const c=await p.userChoice;return c&&c.outcome==='accepted'?'Yükleniyor…':'Yükleme iptal edildi. İstersen tarayıcı menüsünden de ekleyebilirsin.'}catch(e){return 'Yükleme başlatılamadı. Tarayıcı menüsünden “Ana ekrana ekle” seçeneğini dene.'}}
 if(isIOS)return 'iPhone/iPad: Safari’de Paylaş (⬆️) simgesine dokun, sonra “Ana Ekrana Ekle”yi seç.';
 return 'Tarayıcı menüsünden (⋮) “Uygulamayı yükle” veya “Ana ekrana ekle” seçeneğini kullan.'}
/* eski telefonlarda roundRect yoksa çizim hata verip oyunu donduruyordu */
if(typeof CanvasRenderingContext2D!=='undefined'&&!CanvasRenderingContext2D.prototype.roundRect){CanvasRenderingContext2D.prototype.roundRect=function(x,y,w,h,r){r=Math.max(0,Math.min(Array.isArray(r)?(r[0]||0):(r||0),Math.abs(w)/2,Math.abs(h)/2));this.moveTo(x+r,y);this.arcTo(x+w,y,x+w,y+h,r);this.arcTo(x+w,y+h,x,y+h,r);this.arcTo(x,y+h,x,y,r);this.arcTo(x,y,x+w,y,r);this.closePath()}}
const R=20,RH=R*1.732;
/* oyun alanı ekranın oranına göre: geniş ekranda sütun artar, uzun ekranda sıra artar */
const [W,H]=(()=>{try{const b=document.getElementById('wrap').getBoundingClientRect();if(b.width>50&&b.height>50){const q=b.width/b.height;if(q<440/620)return[440,Math.min(900,Math.round(440/q))];return[Math.min(720,Math.round(620*q)),620]}}catch(e){}return[440,620]})();
const COLS=Math.max(11,Math.floor(W/(2*R))),OX=(W-COLS*2*R)/2,SX=W/2;
const SY=H-50,LOSE=SY-R*2.4,MAXR=Math.max(16,Math.floor((LOSE-R)/RH)+2);
const PAL=['#ff2d6f','#26ffa8','#2ec4ff','#ffe600','#b84dff','#ff9a1f'];
const cv=document.getElementById('cv'),ctx=cv.getContext('2d'),$=id=>document.getElementById(id);
let dpr=Math.min(window.devicePixelRatio||1,2),idle=0;cv.style.aspectRatio=W+'/'+H;cv.width=Math.round(W*dpr);cv.height=Math.round(H*dpr);ctx.setTransform(dpr,0,0,dpr,0,0);
let S={state:'menu',score:0,level:1,combo:0,miss:0,arm:null,pw:{bomb:2,rainbow:2,lightning:1,color:1,freeze:1}};
let slide=0,dt=16,grid=[],par=0,ball,next,fly=null,parts=[],falls=[],texts=[],aim={x:SX,y:100},paused=false,sound=true,T=0,shake=0,best=0;
try{best=+localStorage.getItem('nb-best')||0}catch(e){}
